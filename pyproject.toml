[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jsxray"
version = "1.0.0"
description = "Lightweight JavaScript Security Intelligence CLI for penetration testers"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Salman (bashx7)" }]
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "jsbeautifier>=1.15.0",
    "requests>=2.28.0",
    "urllib3>=1.26.0",
]

[project.scripts]
jsxray = "jsxray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
